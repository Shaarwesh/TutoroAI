<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable | Swesh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-6 text-2xl font-bold tracking-wider">SWESH</div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="/dashboard" class="block px-4 py-2 hover:bg-slate-800 rounded-lg">📊 Dashboard</a>
                <a href="/timetable" class="block px-4 py-2 bg-slate-800 rounded-lg">📅 Timetable</a>
                <a href="/students" class="block px-4 py-2 hover:bg-slate-800 rounded-lg">👥 Students</a>
                <a href="/analytics" class="block px-4 py-2 hover:bg-slate-800 rounded-lg">📈 Analytics</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold mb-8">Master Timetable</h1>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <p class="text-gray-500 mb-4">Manage your recurring weekly classes here.</p>
                <!-- We will move the full table here in the future -->
                <p class="text-sm">Currently tracking {{ schedules|length }} active classes.</p>
            </div>
        </main>
    </div>
</body>
</html>
