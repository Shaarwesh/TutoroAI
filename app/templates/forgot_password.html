<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Swesh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Reset Admin Password</h1>
            <p class="text-sm text-gray-500 mt-2">Enter your authorized email to receive a reset link.</p>
        </div>

        <form id="forgotForm" onsubmit="requestReset(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Admin Email</label>
                <input type="email" id="email" required 
                       class="w-full border rounded-lg p-3 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="admin@example.com">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition">
                Send Reset Link
            </button>
        </form>
        
        <div id="message" class="hidden mt-4 text-center text-sm font-medium p-3 rounded-lg"></div>
    </div>

    <script>
        async function requestReset(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            try {
                const formData = new FormData();
                formData.append("email", email);

                const res = await fetch("/admin/request-reset", {
                    method: 'POST',
                    body: formData
                });
                
                messageDiv.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
                
                if (res.ok) {
                    messageDiv.classList.add('bg-emerald-50', 'text-emerald-600');
                    messageDiv.innerText = "If that email matches our records, a reset link has been sent.";
                    document.getElementById('forgotForm').reset();
                } else {
                    messageDiv.classList.add('bg-red-50', 'text-red-600');
                    messageDiv.innerText = "Failed to send request. Please try again.";
                }
            } catch (err) {
                messageDiv.classList.remove('hidden');
                messageDiv.classList.add('bg-red-50', 'text-red-600');
                messageDiv.innerText = "Network error. Please try again.";
            }
            submitBtn.disabled = false;
            submitBtn.innerText = "Send Reset Link";
        }
    </script>
</body>
</html>
