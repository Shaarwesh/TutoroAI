<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Swesh Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-2xl shadow-2xl max-w-sm w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-900 tracking-wider">SWESH</h1>
            <p class="text-sm text-gray-500 mt-2">Sign in to your dashboard</p>
        </div>

        <!-- Show error messages if login fails -->
        {% if error %}
        <div class="bg-red-50 text-red-600 text-sm font-medium p-3 rounded-lg text-center mb-4 border border-red-100">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required 
                       class="w-full border-2 border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-0 transition"
                       placeholder="admin">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-bold text-gray-700">Password</label>
                    <!-- Link to our Forgot Password page! -->
                    <a href="/forgot-password" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition">Forgot?</a>
                </div>
                <input type="password" name="password" required 
                       class="w-full border-2 border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-0 transition"
                       placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-500/30">
                Log In
            </button>
        </form>
    </div>
</body>
</html>
