<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Swesh Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Create New Password</h1>
            <p class="text-sm text-gray-500 mt-2">Please enter your new secure password below.</p>
        </div>

        <form id="resetForm" onsubmit="submitNewPassword(event)" class="space-y-4">
            <!-- We grab the secure token from the URL automatically -->
            <input type="hidden" id="token" value="{{ token }}">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <input type="password" id="new_password" required minlength="8" 
                       class="w-full border rounded-lg p-3 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition">
                Save Password
            </button>
        </form>
        
        <div id="message" class="hidden mt-4 text-center text-sm font-medium p-3 rounded-lg"></div>
    </div>

    <script>
        async function submitNewPassword(e) {
            e.preventDefault();
            
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('new_password').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            try {
                // Send the new password and the secret token to the backend
                const formData = new FormData();
                formData.append("token", token);
                formData.append("new_password", newPassword);

                const res = await fetch("/admin/reset-password", {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();

                messageDiv.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
                
                if (res.ok) {
                    messageDiv.classList.add('bg-emerald-50', 'text-emerald-600');
                    messageDiv.innerText = "Password successfully updated! You can now log in.";
                    document.getElementById('resetForm').reset();
                } else {
                    messageDiv.classList.add('bg-red-50', 'text-red-600');
                    messageDiv.innerText = data.detail || "Link expired or invalid. Please request a new one.";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Save Password";
                }
            } catch (err) {
                messageDiv.classList.remove('hidden');
                messageDiv.classList.add('bg-red-50', 'text-red-600');
                messageDiv.innerText = "Network error. Please try again.";
                submitBtn.disabled = false;
                submitBtn.innerText = "Save Password";
            }
        }
    </script>
</body>
</html>
